# Render Blueprint for the PadungGo backend (Docker, free plan).
# Render Dashboard -> New -> Blueprint -> select this repo.
# Values marked `sync: false` are secrets: Render asks for them in the dashboard.
services:
  - type: web
    name: padunggo-api
    runtime: docker
    plan: free
    region: singapore  # closest Render region to Cebu and to Supabase ap-south-1
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PADUNGGO_DB_ENGINE
        value: postgis
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "False"
      - key: DJANGO_TIME_ZONE
        value: Asia/Manila
      # Owner decision (Oct 2026): show historic/documented GTFS routes, each
      # result labelled "not field-verified". Set "False" to show only verified.
      - key: PLANNER_ALLOW_DOCUMENTED
        value: "True"
      # Large GTFS uploads in Django Admin can take minutes on the free plan.
      - key: GUNICORN_TIMEOUT
        value: "300"
      - key: DJANGO_SECRET_KEY
        generateValue: true          # Render creates a random secret for you
      - key: DATABASE_URL
        sync: false                  # paste the Supabase Session pooler URI
      - key: FRONTEND_ORIGIN
        sync: false                  # your Vercel URL, once the frontend exists
      - key: GEOAPIFY_API_KEY
        sync: false                  # server-side only; never a VITE_* variable
      # "Explain this trip": GroqCloud serving openai/gpt-oss-20b (Apache 2.0).
      # Without AI_API_KEY the button reports "unavailable"; the planner is unaffected.
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      - key: AI_API_KEY
        sync: false                  # server-side only; never a VITE_* variable
